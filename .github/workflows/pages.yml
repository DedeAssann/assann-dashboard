name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install calendar export dependencies
        run: pip install -r requirements.txt

      - name: Export ENSMA Mirror calendar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ENSMA_CALENDAR_ID: ${{ secrets.GOOGLE_ENSMA_CALENDAR_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python scripts/export_calendar.py

      - name: Validate generated site
        env:
          REQUIRE_FRESH_CALENDAR: "1"
        run: |
          node --check assets/app-v2.js
          node --check assets/cloud-v2.js
          python scripts/validate_site.py

      - name: Stage public files
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
